[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asc-mcp"
version = "0.1.0"
description = "MCP server for App Store Connect API"
requires-python = ">=3.10"
# Note: the `asc` library is a path dependency installed via requirements.txt
# (pip can't resolve relative path deps from pyproject.toml directly).
dependencies = [
    # Capped below 2.0: mcp 2.x removed mcp.server.fastmcp (FastMCP moved to a
    # separate `fastmcp` distribution), so a fresh unpinned install breaks the
    # server at import time.
    "mcp>=1.0.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asc_mcp"]

[project.scripts]
asc-mcp = "asc_mcp.server:main"
